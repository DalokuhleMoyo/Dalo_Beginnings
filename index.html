<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Premium Content Access</title>
    <!-- Importing elegant, modern, and readable fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- CSS Variables & Palette Definition --- */
        :root {
            --bg-pale-pink: #F8DDE5;
            --bg-pale-pink-2: #FCECEF;
            --color-blush: #F5C8D4;
            --color-accent-rose: #EFA6B9;
            --color-main-pink: #F15B78;
            --color-white: #FFFFFF;
            --color-off-white: #FFF9FB;
            --color-text: #3F3940;
            --color-secondary-text: #8E7C84;
            --color-border-pale: #E8DDE1;
        }

        /* --- General Reset & Typography --- */
        body {
            font-family: 'Manrope', sans-serif; /* Primary modern font */
            background-color: var(--bg-pale-pink);
            background-image: radial-gradient(circle at top left, var(--bg-pale-pink) 0%, var(--bg-pale-pink-2) 60%, var(--color-blush) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--color-text);
        }

        /* --- Background Flowing Shapes (Subtle Depth) --- */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(245, 200, 212, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 0;
        }

        /* --- Main Checkout Panel --- */
        .container {
            background-color: var(--color-off-white);
            padding: 40px 50px;
            border-radius: 25px; /* Large rounded corners */
            box-shadow: 0 15px 40px rgba(100, 60, 75, 0.1); /* Soft diffused shadow */
            width: 100%;
            max-width: 1200px; /* Wider container for desktop view */
            position: relative;
            z-index: 1;
        }

        /* --- Top Navigation/Progress Bar --- */
        .nav-bar {
            display: flex;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--color-border-pale);
            margin-bottom: 30px;
            gap: 30px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo {
            width: 40px;
            height: 40px;
            background-color: var(--color-accent-rose);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 8px rgba(239, 166, 185, 0.6);
        }
        .logo-mark {
            color: var(--color-white);
            font-size: 18px;
            /* Placeholder for a petal/abstract mark */
            transform: rotate(15deg); 
        }
        .brand-name {
            font-family: 'Playfair Display', serif; /* Elegant Serif for Brand */
            font-size: 1.3em;
            font-weight: 700;
            color: var(--color-text);
        }

        .progress-stages {
            display: flex;
            gap: 15px;
        }
        .stage {
            display: flex;
            align-items: center;
            color: var(--color-secondary-text);
            font-size: 0.9em;
            font-weight: 600;
            transition: color 0.3s;
        }
        .stage-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .stage-dot.active {
            background-color: var(--color-main-pink);
            border: 2px solid var(--color-main-pink);
        }
        .stage-text {
            margin-left: 8px;
        }
        /* Active state indicator */
        .stage.active .stage-dot {
            background-color: var(--color-main-pink);
        }
        .stage:not(.active) .stage-dot {
            background-color: var(--color-border-pale);
        }


        /* --- MAIN CONTENT LAYOUT (Desktop Two-Column) --- */
        .content-wrapper {
            display: flex;
            gap: 50px;
            margin-top: 30px;
        }

        /* --- LEFT COLUMN: Card Preview --- */
        .card-preview-container {
            flex: 1.2; /* Slightly wider than the form */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: var(--color-blush); /* Subtle backdrop for the card */
            border-radius: 15px;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.7);
        }

        .card-display {
            position: relative;
            width: 230px; 
            height: 145px;
            border-radius: 15px;
            /* Gradient: Pink/Coral */
            background: linear-gradient(135deg, #FF6682 0%, #F45170 100%); 
            box-shadow: 0 12px 20px rgba(100, 40, 60, 0.15);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--color-accent-rose);
        }
        /* Layered card effect */
        .card-display::before {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            background-color: var(--color-off-white);
            border-radius: 10px;
            transform: translate(5px, 5px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .card-elements {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
        }
        .card-details h3 {
            color: var(--color-white);
            font-family: 'Playfair Display', serif;
            margin: 0;
            font-size: 1.4em;
            letter-spacing: 1px;
        }
        .card-number-display {
            font-size: 1.1em;
            font-weight: 600;
            color: #F5D193; /* Gold-like color */
            margin-top: 5px;
        }
        .chip {
            width: 30px;
            height: 20px;
            background-color: #FFD700; /* Gold/Yellow */
            border-radius: 4px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }
        .decorative-mark {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid var(--color-main-pink);
        }

        /* --- RIGHT COLUMN: Payment Form --- */
        .form-container {
            flex: 1;
            padding-left: 20px;
        }
        .payment-header {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 30px;
            border-bottom: 3px solid var(--color-accent-rose);
            padding-bottom: 10px;
        }

        /* Form Field Styling */
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: flex;
            align-items: center;
            font-size: 0.85em;
            letter-spacing: 1px;
            color: var(--color-secondary-text);
            margin-bottom: 5px;
        }
        .form-group i {
            margin-right: 8px;
            color: var(--color-accent-rose);
            font-size: 1.1em;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--color-border-pale);
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }
        input:focus {
            border-color: var(--color-main-pink);
            box-shadow: 0 0 0 3px rgba(241, 91, 120, 0.2);
            outline: none;
        }

        /* Field Grouping for MM/YYYY and CVV */
        .row-fields {
            display: flex;
            gap: 15px;
        }
        .row-fields .form-group {
            flex: 1;
        }

        /* Total Display */
        .payment-total {
            margin-top: 30px;
            padding: 15px 0;
            text-align: right;
            font-size: 1.2em;
            border-top: 1px solid var(--color-border-pale);
        }
        .total-label {
            color: var(--color-secondary-text);
            font-weight: 500;
            margin-right: 10px;
        }
        .total-amount {
            color: var(--color-main-pink);
            font-weight: 700;
            font-size: 1.4em;
        }

        /* Payment Button */
        #submitButton {
            margin-top: 30px;
            background-image: linear-gradient(to right, #F35D7A, #EA5270);
            box-shadow: 0 4px 10px rgba(244, 82, 112, 0.4); /* Subtle initial shadow */
        }
        #submitButton:hover {
            background-image: linear-gradient(to right, #EA5270, #F35D7A);
            box-shadow: 0 6px 15px rgba(244, 82, 112, 0.6); /* Slightly brighter/lifted on hover */
        }

        /* Message Area */
        #message {
            margin-top: 25px;
            border-width: 2px; /* Thicker border for impact */
        }
        .success { 
            background-color: #d4edda; 
            color: #155724; 
            border-color: #28a745; 
        }
        .error { 
            background-color: #f8d7da; 
            color: #721c24; 
            border-color: #dc3545; 
        }

        /* --- Responsiveness (Mobile First Adaptation) --- */
        @media (max-width: 900px) {
            .container {
                padding: 30px 25px;
                box-shadow: 0 10px 25px rgba(100, 60, 75, 0.1);
                max-width: 95%;
            }
            .content-wrapper {
                flex-direction: column; /* Stacked layout */
                gap: 30px;
            }
            .card-preview-container {
                width: 90%;
                margin: 0 auto; /* Center card when stacked */
                padding: 20px 0;
            }
            .card-display {
                width: 90%; /* Wider on smaller screens */
                height: auto;
            }
            .form-container {
                padding-left: 0; /* No extra padding when stacked */
            }
            .nav-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .progress-stages {
                justify-content: space-between;
                width: 100%;
            }
            .stage {
                flex-grow: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOP NAVIGATION -->
        <div class="nav-bar">
            <div class="logo-area">
                <div class="logo">
                    <span class="logo-mark"><i class="fas fa-feather-alt"></i></span> 
                    <!-- Placeholder for an abstract mark or petal -->
                </div>
                <span class="brand-name">VelvetVault</span>
            </div>

            <div class="progress-stages">
                <div class="stage"><span class="stage-dot active"></span><span class="stage-text">Browse</span></div>
                <div class="stage"><span class="stage-dot"></span><span class="stage-text">Shipping</span></div>
                <div class="stage active"><span class="stage-dot active"></span><span class="stage-text">Payment Method</span></div>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="content-wrapper">

            <!-- LEFT COLUMN: CARD PREVIEW -->
            <div class="card-preview-container">
                <div class="card-display">
                    <div class="card-elements">
                        <!-- EMV Chip & Contactless -->
                        <div class="chip"></div> 

                        <div class="card-details">
                            <h3 id="cardHolderPlaceholder">ALEX J.</h3>
                            <div class="card-number-display" id="cardNumberPlaceholder">XXXX XXXX XXXX 1234</div>
                            <small style="color: var(--color-secondary-text); font-size: 0.8em;">Expires 08/28</small>
                        </div>

                        <!-- Decorative Mark -->
                        <div class="decorative-mark"></div>
                    </div>
                </div>
                <!-- Layered effect element is implicit in the CSS::before pseudo-element -->
            </div>

            <!-- RIGHT COLUMN: PAYMENT FORM -->
            <div class="form-container">
                <h2 class="payment-header">Payment Details</h2>

                <!-- Form Start -->
                <form id="paymentForm">

                    <!-- Cardholder Name -->
                    <div class="form-group">
                        <label for="cardholderName"><i class="fas fa-user-circle"></i> CARDHOLDER NAME</label>
                        <input type="text" id="cardholderName" name="cardholderName" placeholder="Enter full name" required>
                    </div>

                    <!-- Card Number -->
                    <div class="form-group">
                        <label for="cardNumber"><i class="fas fa-credit-card"></i> CARD NUMBER</label>
                        <input type="text" id="cardNumber" name="cardNumber" placeholder="Enter 16-digit number" required>
                    </div>

                    <!-- Expiry Row (MM / YYYY) -->
                    <div class="form-group row-fields">
                        <div class="form-group">
                            <label for="expiryMonth"><i class="fas fa-calendar-alt"></i> MONTH</label>
                            <input type="text" id="expiryMonth" name="expiryMonth" placeholder="MM" maxlength="2" required>
                        </div>
                        <div class="form-group">
                            <label for="expiryYear"><i class="fas fa-calendar-alt"></i> YEAR</label>
                            <input type="text" id="expiryYear" name="expiryYear" placeholder="YYYY" maxlength="4" required>
                        </div>
                    </div>

                    <!-- CVV -->
                    <div class="form-group">
                        <label for="cvv"><i class="fas fa-lock"></i> CVV</label>
                        <input type="text" id="cvv" name="cvv" placeholder="Enter 3 or 4 digits" required>
                    </div>

                    <!-- Payment Total Display -->
                    <div class="payment-total">
                        <span class="total-label">Payment Amount:</span>
                        <span class="total-amount">$19.99</span>
                    </div>

                    <!-- Pay Button -->
                    <button type="submit" id="submitButton"> Complete Purchase </button>
                </form>

                <div id="message"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('paymentForm');
            const messageDiv = document.getElementById('message');
            const submitButton = document.getElementById('submitButton');
            const cardNumberInput = document.getElementById('cardNumber');
            const expiryMonthInput = document.getElementById('expiryMonth');
            const expiryYearInput = document.getElementById('expiryYear');

            // --- ⚙️ FIELD FORMATTING LOGIC ---

            // 1. Card Number Formatting (Auto spacing every 4 digits)
            cardNumberInput.addEventListener('input', function(e) {
                let input = e.target.value.replace(/\s/g, '');
                let formatted = '';
                for (let i = 0; i &lt; input.length; i++) {
                    if (i &gt; 0 &amp;&amp; i % 4 === 0) {
                        formatted += ' ';
                    }
                    formatted += input[i];
                }
                e.target.value = formatted;
            });

            // 2. Expiry Date Combining Logic (Manually combining MM and YYYY into one submission object)
            // Since we split MM and YYYY, we need to handle the formatting for display in the JS logic.

            // Real-time display update for the card preview
            function updateCardPreview() {
                const name = document.getElementById('cardholderName').value || 'Subscriber';
                const number = cardNumberInput.value.replace(/\s/g, '') || 'XXXX XXXX XXXX XXXX';

                // Update placeholder values dynamically
                document.getElementById('cardHolderPlaceholder').textContent = name.toUpperCase().substring(0, 3) + '.';
                document.getElementById('cardNumberPlaceholder').textContent = number.padStart(16, '0').match(/.{1,4}/g).join(' ');
            }

            // Attach update function to all relevant fields
            document.getElementById('cardholderName').addEventListener('input', updateCardPreview);
            cardNumberInput.addEventListener('input', updateCardPreview);
            expiryMonthInput.addEventListener('input', updateCardPreview);
            expiryYearInput.addEventListener('input', updateCardPreview);


            // --- 📡 SUBMISSION LOGIC ---

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                // 1. Gather data from the form fields
                const formData = {
                    cardNumber: cardNumberInput.value, // Already formatted with spaces
                    cardholderName: document.getElementById('cardholderName').value,
                    // Combine Month and Year for the backend, or send them separately. 
                    // We send them separately here for granular logging accuracy.
                    expiryMonth: expiryMonthInput.value.replace(/\//g, ''), 
                    expiryYear: expiryYearInput.value,
                    cvv: document.getElementById('cvv').value
                };

                // Disable button and show loading state
                submitButton.textContent = 'Processing... Accessing Vault...';
                submitButton.disabled = true;
                messageDiv.style.display = 'none';

                // 2. Send data to the Flask backend endpoint
                fetch('/submit_card', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                })
                .then(response => {
                    if (!response.ok) {
                        // Handle HTTP errors (4xx or 5xx)
                        return response.json().then(err => { throw new Error(err.message || 'Server Error'); });
                    }
                    return response.json();
                })
                .then(data => {
                    // 3. Handle the response from the server
                    if (data.status === 'success') {
                        // SUCCESS MESSAGE (The Hook)
                        messageDiv.className = 'success';
                        messageDiv.innerHTML = `<strong style="font-size: 1.1em;">🎉 ${data.message}</strong>
Your details captured successfully for immediate access.`;
                    } else {
                        // FAILURE MESSAGE
                        messageDiv.className = 'error';
                        messageDiv.innerHTML = `<strong style="font-size: 1.1em;">❌ TRANSACTION FAILED:</strong> ${data.message}`;
                    }
                    messageDiv.style.display = 'block';
                })
                .catch(error => {
                    // NETWORK ERROR (The server isn't running or is unreachable)
                    messageDiv.className = 'error';
                    messageDiv.innerHTML = `<strong style="font-size: 1.1em;">🚨 CONNECTION ERROR:</strong> Could not reach the payment gateway server. Ensure the 'app.py' server is running locally!`;
                    messageDiv.style.display = 'block';
                })
                .finally(() => {
                    // Re-enable button regardless of outcome
                    submitButton.textContent = 'Complete Purchase';
                    submitButton.disabled = false;
                });
            });

            // Initial population of the preview card state
            updateCardPreview();
        });
    </script>
</body>
</html>
